<style>
  :root{--blue:#005FF9;--blue2:#0345BF;--navy:#08246E;--teal:#5B8DEF;--g1:#FAFAFA;--g2:#eef1f6;--ink:#141414;--ink2:#3F3F3F;--border:#e3e8f0;--border2:#cbd4e6;--radius:9px;--radius-lg:12px;--shadow-xs:0 1px 3px rgba(8,36,110,.06);--shadow-sm:0 4px 16px rgba(8,36,110,.08);--shadow-md:0 16px 44px rgba(8,36,110,.11);--transition:.18s ease}
  *{box-sizing:border-box}
  body{margin:0;background:var(--g2);color:var(--ink);font-family:'Barlow',Arial,sans-serif;font-size:15px;line-height:1.45}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 18px 80px}

  table.matrix td.lbl{text-align:left;background:var(--g1);white-space:nowrap}

  table.matrix input{border:1px solid #eee;border-radius:5px;padding:6px;text-align:center;transition:border-color var(--transition),box-shadow var(--transition)}
  table.matrix .rolecell{display:flex;gap:6px;align-items:center}

  .delrole{border:1px solid var(--border2);background:#fff;color:#b23b3b;border-radius:var(--radius);cursor:pointer;padding:4px 8px;font-weight:700;transition:background var(--transition),border-color var(--transition)}
  .delrole:hover{background:#fdeaea;border-color:#e3b3b3}
  .card{border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow-xs);transition:box-shadow var(--transition)}
  .card:hover{box-shadow:var(--shadow-sm)}
  .chead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .chead input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue)}
  .chead .t{font-weight:700;font-size:13px;text-transform:uppercase;color:var(--navy);letter-spacing:.03em}
  .legalgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
  .legalgrid label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer}
  .legalgrid input{width:17px;height:17px;accent-color:var(--blue)}
  .crrow{display:grid;grid-template-columns:1.3fr 1fr 1.4fr auto;gap:8px;margin-bottom:8px}
  .crrow input{font-size:13.5px}
  .btns{display:flex;gap:15px;margin-top:28px;justify-content:center;flex-wrap:wrap}
  button.act{font-family:inherit;font-size:15px;font-weight:600;border-radius:var(--radius);padding:14px 28px;cursor:pointer;border:1px solid var(--border2);background:#fff;color:var(--navy);display:inline-flex;align-items:center;gap:10px;transition:background var(--transition),border-color var(--transition),box-shadow var(--transition),transform var(--transition)}
  button.act:hover{border-color:var(--blue2);box-shadow:var(--shadow-xs);transform:translateY(-1px)}

  .tinybtn:hover{border-color:var(--blue2);background:#f0f4ff}
  .warn{font-size:13px;margin-top:15px;padding:12px 14px;border-radius:var(--radius);display:none;text-align:center}
  .warn.ok{color:#1c6b4a;background:#e8f8f0;border:1px solid #bfe8d5}
  .warn.err{color:#8a2b2b;background:#fdeaea;border:1px solid #f4c7c7}
  .hint{font-size:12px;color:#8a93a8;margin-top:5px}
  .req{color:#c0392b;font-weight:700}
  .fld.error input,.fld.error textarea,.fld.error select{border-color:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.15)}
  table.matrix input.badnum{border-color:#c0392b;background:#fdeaea}
  #autosave_hint.flash{animation:flashHint .8s ease}
  @keyframes flashHint{0%{background:#d7ebff}100%{background:transparent}}
  html{scroll-behavior:smooth}
  .secnav{position:fixed;left:14px;top:90px;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 6px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow-sm);font-size:12.5px;max-width:150px}
  .secnav a{color:var(--ink2);text-decoration:none;padding:8px 10px 8px 12px;border-radius:7px;font-weight:600;border-left:3px solid transparent;transition:background var(--transition),color var(--transition),border-color var(--transition)}
  .secnav a:hover{background:var(--g2);color:var(--navy)}
  .secnav a.active{color:var(--blue2);background:#eef3fe;border-left-color:var(--blue)}
  @media (max-width:1300px){.secnav{display:none}}
</style>
</head>

<nav class=&quot;secnav&quot; id=&quot;secnav&quot;>

  <a href=&quot;#sec-alcance&quot; data-sec=&quot;sec-alcance&quot;>2 · Alcance</a>

<div class=&quot;wrap&quot;>
  <header>
    <div class=&quot;brand&quot;>
      <svg width=&quot;24&quot; height=&quot;34&quot; viewBox=&quot;0 0 232 326&quot; aria-hidden=&quot;true&quot;><path d=&quot;M0 326H69.07C159.06 326 232 253.02 232 163 232 72.97 159.06 0 69.07 0H0V81.4H78.95C123.72 81.4 160.01 117.7 160.01 162.48 160.01 207.26 123.72 243.55 78.95 243.55H0&quot; fill=&quot;#ffffff&quot;/></svg>
      <div><span class=&quot;wordmark&quot;>DOMINION</span><span class=&quot;divtag&quot;>E&amp;amp;C</span></div>

    <div class=&quot;tool-title&quot;>Generador de Ofertas · Dominion Iberia</div>
  </header>
  <div class=&quot;accentbar&quot;></div>
  <div class=&quot;body&quot;>

    <div class=&quot;hint&quot; style=&quot;margin:0 0 14px;font-size:13px;color:#4a5568&quot;>Rellena los campos y pulsa <b>Generar oferta .docx</b>. Tu borrador se guarda solo en este equipo; usa <b>Guardar/Cargar borrador</b> para compartirlo.</div>

    <div class=&quot;sec&quot; id=&quot;sec-portada&quot;>1 · Portada</div>
    <div class=&quot;row&quot;>
      <div class=&quot;fld&quot;><label>Título — línea 1</label><input id=&quot;f_t1&quot; placeholder=&quot;Maintenance of Rotary Kiln&quot;></div>
      <div class=&quot;fld&quot;><label>Título — línea 2 (cliente / localidad)</label><input id=&quot;f_t2&quot; list=&quot;dl_hist_f_t2&quot; placeholder=&quot;Currenta Leverkusen&quot;><datalist id=&quot;dl_hist_f_t2&quot;></datalist></div>

      <div class=&quot;fld&quot; id=&quot;fld_f_ref&quot;><label>Our Ref (DIB) <span class=&quot;req&quot;>*</span></label><input id=&quot;f_ref&quot; placeholder=&quot;DIB-26-03-0010&quot;><div class=&quot;hint&quot;>Formato: DIB-AA-MM-NNNN (ej. DIB-26-03-0010).</div></div>

    </div>
    <div class=&quot;row&quot;>
      <div class=&quot;fld&quot; id=&quot;fld_f_desc&quot;><label>Project Description <span class=&quot;req&quot;>*</span></label><input id=&quot;f_desc&quot; placeholder=&quot;Rotary kiln at Currenta – Leverkusen&quot;></div>
      <div class=&quot;fld&quot;><label>Dear (saludo)</label><input id=&quot;f_dear&quot; placeholder=&quot;Robert&quot;></div>
    </div>

    <div class=&quot;sec&quot; id=&quot;sec-alcance&quot;>2 · Alcance y ubicación</div>
    <div class=&quot;row&quot;>
      <div class=&quot;fld&quot;><label>Tipo de trabajo (elige o escribe uno)</label>
        <input id=&quot;f_worktype&quot; list=&quot;dl_wt&quot; placeholder=&quot;maintenance&quot;>
        <datalist id=&quot;dl_wt&quot;>
          <option value=&quot;maintenance&quot;></option><option value=&quot;furnace repair&quot;></option><option value=&quot;refractory works&quot;></option>
          <option value=&quot;boiler repair&quot;></option><option value=&quot;furnace reconstruction&quot;></option><option value=&quot;shuttering works for tube walls&quot;></option>
        </datalist>
      </div>
      <div class=&quot;fld&quot;><label>Unidad / unidades a trabajar</label><input id=&quot;f_unit&quot; placeholder=&quot;Unit 10, Furnace section B&quot;></div>
    </div>
    <div class=&quot;row&quot;>
      <div class=&quot;fld&quot;><label>Ciudad</label><input id=&quot;f_loc&quot; list=&quot;dl_hist_f_loc&quot; placeholder=&quot;Leverkusen&quot;><datalist id=&quot;dl_hist_f_loc&quot;></datalist></div>
      <div class=&quot;fld&quot;><label>País</label><input id=&quot;f_country&quot; list=&quot;dl_hist_f_country&quot; placeholder=&quot;Germany&quot;><datalist id=&quot;dl_hist_f_country&quot;></datalist></div>
    </div>
    <div class=&quot;hint&quot; id=&quot;scope_prev&quot;></div>

    <div class=&quot;sec&quot; id=&quot;sec-precios&quot;>3 · Fases (Steps), personal y precios</div>
    <div class=&quot;row stepsbar&quot;>
      <div class=&quot;fld&quot;><label>Nº de fases (steps)</label>
        <select id=&quot;f_steps&quot;><option value=&quot;1&quot;>1 step</option><option value=&quot;2&quot;>2 steps</option><option value=&quot;3&quot;>3 steps</option><option value=&quot;4&quot;>4 steps</option></select>
      </div>
      <div class=&quot;fld&quot;><label>Días</label><select id=&quot;f_days&quot;><option>Monday to Saturday</option><option>Monday to Friday</option><option>Sunday to Friday</option></select></div>
      <div class=&quot;fld&quot;><label>Turnos</label><select id=&quot;f_shifts&quot;><option value=&quot;one&quot;>1 turno</option><option value=&quot;two&quot;>2 turnos (día y noche)</option></select></div>
      <div class=&quot;fld&quot; id=&quot;wrap_shifttype&quot;><label>Tipo de turno (si 1)</label><select id=&quot;f_shifttype&quot;><option value=&quot;day&quot;>Día (day shift)</option><option value=&quot;night&quot;>Noche (night shift)</option></select></div>
      <div class=&quot;fld&quot;><label>Horas / turno</label><input id=&quot;f_hours&quot; placeholder=&quot;10&quot;></div>
    </div>
    <div class=&quot;hint&quot;>Cada columna de la tabla es una fase (step) y cada fila es un rol/categoría de personal; con 2 turnos cada fase se divide en Day/Night.</div>
    <div class=&quot;matrix-container&quot; id=&quot;matrix&quot;></div>
    <button class=&quot;tinybtn&quot; id=&quot;mp_addrow&quot; type=&quot;button&quot;>+ Añadir rol / categoría</button>

    <div class=&quot;hint&quot;>Puedes renombrar los steps y los roles, borrar roles (✕) o añadir nuevos. Con 2 turnos se reparte el personal en <b>Day shift</b> / <b>Night shift</b> por fase.</div>

    <div class=&quot;sec&quot; id=&quot;sec-docs&quot;>4 · Secciones editables</div>
    <div class=&quot;card&quot;>

    <div class=&quot;card&quot;>

    </div>
    <div class=&quot;card&quot;>

      <div class=&quot;hint&quot;>Editable. Escribe el responsable (DDE, DIB, ALTAC, N/A…) y el detalle. Sale en inglés dentro de Pricing.</div>

      <datalist id=&quot;dl_crr&quot;><option value=&quot;DIB&quot;></option><option value=&quot;DDE&quot;></option><option value=&quot;ALTAC&quot;></option><option value=&quot;Client&quot;></option><option value=&quot;N/A&quot;></option></datalist>
      <datalist id=&quot;dl_crd&quot;><option value=&quot;Complete Management&quot;></option><option value=&quot;Management and Payment&quot;></option><option value=&quot;(+10% Fee)&quot;></option><option value=&quot;Management and Payment (+10% Fee)&quot;></option><option value=&quot;N/A&quot;></option></datalist>
      <div id=&quot;cr_rows&quot; style=&quot;margin-top:10px&quot;></div>
      <button class=&quot;tinybtn&quot; id=&quot;cr_add&quot; type=&quot;button&quot;>+ Añadir concepto</button>

quired special site safety inductions prior to the arrival to site;&quot;, &quot;And in general, anything not specified as included in this quotation.&quot;], &quot;payment&quot;: [&quot;100% according to installation progress with monthly payments&quot;, &quot;Payments will be done by bank transfer 60 days from invoice date, except for the down-payment, which will be paid upon invoice presentation.&quot;]}};</script>
<script>
(function(){
  var T=window.__TPL__;
  var g=function(id){return document.getElementById(id);};
  var v=function(id){var e=g(id);return e?e.value.trim():&quot;&quot;;};
  function xesc(s){return String(s==null?&quot;&quot;:s).replace(/&amp;/g,&quot;&amp;amp;&quot;).replace(/</g,&quot;&amp;lt;&quot;).replace(/>/g,&quot;&amp;gt;&quot;);}
  function aesc(s){return String(s==null?&quot;&quot;:s).replace(/&amp;/g,&quot;&amp;amp;&quot;).replace(/&quot;/g,&quot;&amp;quot;&quot;).replace(/</g,&quot;&amp;lt;&quot;);}

  /* histórico por campo (autocompletado) */
  function histKey(id){return &quot;hist_&quot;+id;}
  function loadHist(id){try{var a=JSON.parse(localStorage.getItem(histKey(id))||&quot;[]&quot;);return Array.isArray(a)?a:[];}catch(e){return [];}}
  function fillHistDatalist(id){var dl=g(&quot;dl_hist_&quot;+id);if(!dl)return;dl.innerHTML=loadHist(id).map(function(val){return '<option value=&quot;'+aesc(val)+'&quot;></option>';}).join(&quot;&quot;);}
  function saveHist(id){var el=g(id);if(!el)return;var val=el.value.trim();if(!val)return;var arr=loadHist(id).filter(function(x){return x!==val;});arr.unshift(val);if(arr.length>8)arr=arr.slice(0,8);try{localStorage.setItem(histKey(id),JSON.stringify(arr));}catch(e){}fillHistDatalist(id);}
  var HIST_FIELDS_OFF=[&quot;f_t2&quot;,&quot;f_att&quot;,&quot;f_loc&quot;,&quot;f_country&quot;];
  HIST_FIELDS_OFF.forEach(fillHistDatalist);

  /* defaults */
  (function(){var d=new Date();var p=function(n){return(n<10?&quot;0&quot;:&quot;&quot;)+n;};g(&quot;f_coverdate&quot;).value=d.getFullYear()+&quot;-&quot;+p(d.getMonth()+1)+&quot;-&quot;+p(d.getDate());})();
  g(&quot;f_reldocs&quot;).value=(T.DEFAULTS.relevant||[]).join(&quot;\n&quot;);
  g(&quot;f_exclusions&quot;).value=(T.DEFAULTS.exclusions||[]).join(&quot;\n&quot;);
  g(&quot;f_payment&quot;).value=(T.DEFAULTS.payment||[]).join(&quot;\n&quot;);
  g(&quot;f_hours&quot;).value=&quot;10&quot;;
  g(&quot;f_rev&quot;).value=&quot;0&quot;;

  /* cost responsibility rows */
  var CR_DEF=[
    [&quot;Flight Tickets&quot;,&quot;&quot;,&quot;Complete Management&quot;],
    [&quot;Visa&quot;,&quot;&quot;,&quot;Complete Management&quot;],
    [&quot;Accommodation&quot;,&quot;&quot;,&quot;Complete Management&quot;],
    [&quot;General Documentation&quot;,&quot;&quot;,&quot;Complete Management&quot;],
    [&quot;Local Transportation&quot;,&quot;&quot;,&quot;Complete Management&quot;],
    [&quot;Other Expenses (Medical, etc.)&quot;,&quot;&quot;,&quot;(+10% Fee)&quot;],
    [&quot;Transport in Portugal&quot;,&quot;&quot;,&quot;Management and Payment (+10% Fee)&quot;]
  ];
  function crRow(c,r,dt){
    var d=document.createElement(&quot;div&quot;);d.className=&quot;crrow&quot;;
    d.innerHTML='<input class=&quot;cr_c&quot; list=&quot;dl_crc&quot; placeholder=&quot;Concept&quot; value=&quot;'+aesc(c)+'&quot;><input class=&quot;cr_r&quot; list=&quot;dl_crr&quot; placeholder=&quot;Responsible&quot; value=&quot;'+aesc(r)+'&quot;><input class=&quot;cr_d&quot; list=&quot;dl_crd&quot; placeholder=&quot;Detail&quot; value=&quot;'+aesc(dt)+'&quot;><button type=&quot;button&quot; class=&quot;delrole cr_del&quot;>✕</button>';
    g(&quot;cr_rows&quot;).appendChild(d);
    d.querySelector(&quot;.cr_del&quot;).onclick=function(){d.remove();};
  }
  CR_DEF.forEach(function(x){crRow(x[0],x[1],x[2]);});
  g(&quot;cr_add&quot;).onclick=function(){crRow(&quot;&quot;,&quot;&quot;,&quot;&quot;);};

  /* scope preview */
  function scopeMid(){var wt=v(&quot;f_worktype&quot;)||&quot;works&quot;;var u=v(&quot;f_unit&quot;);var l=v(&quot;f_loc&quot;);var c=v(&quot;f_country&quot;);
    return wt+(u?(&quot; of &quot;+u):&quot;&quot;)+(l?(&quot; in &quot;+l):&quot;&quot;)+(c?(&quot;, &quot;+c):&quot;&quot;);}
  function updScope(){g(&quot;scope_prev&quot;).textContent=&quot;Frase: “…supply labour and supervision for the &quot;+scopeMid()+&quot; all in general accordance with your Enquiry.”&quot;;}
  [&quot;f_worktype&quot;,&quot;f_unit&quot;,&quot;f_loc&quot;,&quot;f_country&quot;].forEach(function(id){g(id).addEventListener(&quot;input&quot;,updScope);});
  [&quot;f_ref&quot;,&quot;f_desc&quot;,&quot;f_att&quot;].forEach(function(id){g(id).addEventListener(&quot;input&quot;,function(){var fe=g(&quot;fld_&quot;+id);if(fe)fe.classList.remove(&quot;error&quot;);});});

  /* ---------------- MATRIX STATE ---------------- */
  var roleSeq=0;
  var badAmounts=0;
  var state={roles:[],stepNames:[&quot;Step 1&quot;,&quot;Step 2&quot;,&quot;Step 3&quot;,&quot;Step 4&quot;],mp:{},data:{}};
  [&quot;Foreman&quot;,&quot;Team Leader&quot;,&quot;Mason&quot;,&quot;Helper&quot;].forEach(function(n){state.roles.push({id:++roleSeq,name:n});});
  function nSteps(){return parseInt(g(&quot;f_steps&quot;).value);}
  function twoShifts(){return g(&quot;f_shifts&quot;).value===&quot;two&quot;;}
  function colDefs(){
    var n=nSteps(),two=twoShifts(),cols=[];
    for(var s=1;s<=n;s++){
      if(two){cols.push({s:s,sh:&quot;day&quot;});cols.push({s:s,sh:&quot;night&quot;});}
      else cols.push({s:s,sh:&quot;&quot;});
    }
    return cols;
  }
  function mpKey(rid,s,sh){return rid+&quot;_&quot;+s+&quot;_&quot;+sh;}
  function dKey(id,s){return id+&quot;_&quot;+s;}
  function captureMatrix(){
    document.querySelectorAll(&quot;#matrix .stepname&quot;).forEach(function(i){state.stepNames[parseInt(i.dataset.s)-1]=i.value;});
    document.querySelectorAll(&quot;#matrix .rolename&quot;).forEach(function(i){var r=state.roles.find(function(x){return x.id==i.dataset.rid;});if(r)r.name=i.value;});
    document.querySelectorAll(&quot;#matrix .in-mp&quot;).forEach(function(i){state.mp[mpKey(i.dataset.rid,i.dataset.s,i.dataset.sh)]=i.value;});
    document.querySelectorAll(&quot;#matrix .in-d&quot;).forEach(function(i){state.data[dKey(i.dataset.id,i.dataset.s)]=i.value;});
  }
  function renderMatrix(){
    var n=nSteps(),two=twoShifts(),cols=colDefs();
    var h='<table class=&quot;matrix&quot;><thead>';
    h+='<tr><th '+(two?'rowspan=&quot;2&quot;':'')+' style=&quot;width:220px;text-align:left&quot;>Rol \\ Fase</th>';
    for(var s=1;s<=n;s++) h+='<th '+(two?'colspan=&quot;2&quot;':'')+'><input class=&quot;stepname&quot; data-s=&quot;'+s+'&quot; value=&quot;'+aesc(state.stepNames[s-1]||(&quot;Step &quot;+s))+'&quot; placeholder=&quot;Step '+s+'&quot;></th>';
    h+='</tr>';
    if(two){h+='<tr>';for(var s=1;s<=n;s++)h+='<th>Day shift</th><th>Night shift</th>';h+='</tr>';}
    h+='</thead><tbody>';
    state.roles.forEach(function(r){
      h+='<tr><td class=&quot;lbl&quot;><div class=&quot;rolecell&quot;><input class=&quot;rolename&quot; data-rid=&quot;'+r.id+'&quot; value=&quot;'+aesc(r.name)+'&quot; placeholder=&quot;Rol&quot;><button type=&quot;button&quot; class=&quot;delrole&quot; data-rid=&quot;'+r.id+'&quot;>✕</button></div></td>';
      cols.forEach(function(c){h+='<td><input type=&quot;number&quot; class=&quot;in-mp&quot; data-rid=&quot;'+r.id+'&quot; data-s=&quot;'+c.s+'&quot; data-sh=&quot;'+c.sh+'&quot; placeholder=&quot;0&quot; value=&quot;'+aesc(state.mp[mpKey(r.id,c.s,c.sh)]||&quot;&quot;)+'&quot;></td>';});
      h+='</tr>';
    });
    var rows=[[&quot;start&quot;,&quot;Start date&quot;,&quot;date&quot;,&quot;dd/mm/aaaa&quot;],[&quot;end&quot;,&quot;End date&quot;,&quot;date&quot;,&quot;dd/mm/aaaa&quot;],[&quot;lump&quot;,&quot;Lump-sum (€)&quot;,&quot;text&quot;,&quot;42.200,00&quot;],[&quot;hourly&quot;,&quot;Hourly rate (€/h)&quot;,&quot;text&quot;,&quot;33,30&quot;],[&quot;mob&quot;,&quot;Mobilization (€/man)&quot;,&quot;text&quot;,&quot;640,00&quot;]];
    rows.forEach(function(rw){
      h+='<tr><td class=&quot;lbl money&quot;>'+rw[1]+'</td>';
      for(var s=1;s<=n;s++)h+='<td '+(two?'colspan=&quot;2&quot;':'')+'><input type=&quot;'+rw[2]+'&quot; class=&quot;in-d&quot; data-id=&quot;'+rw[0]+'&quot; data-s=&quot;'+s+'&quot; placeholder=&quot;'+rw[3]+'&quot; value=&quot;'+aesc(state.data[dKey(rw[0],s)]||&quot;&quot;)+'&quot;></td>';
      h+='</tr>';
    });
    h+='</tbody></table>';
    g(&quot;matrix&quot;).innerHTML=h;
    document.querySelectorAll(&quot;#matrix .delrole&quot;).forEach(function(b){b.onclick=function(){captureMatrix();if(state.roles.length<=1)return;state.roles=state.roles.filter(function(x){return x.id!=b.dataset.rid;});renderMatrix();};});
    updTotals();
  }
  function rebuild(){captureMatrix();renderMatrix();}
  g(&quot;f_steps&quot;).onchange=rebuild;
  g(&quot;f_shifts&quot;).onchange=function(){g(&quot;wrap_shifttype&quot;).style.display=twoShifts()?&quot;none&quot;:&quot;&quot;;rebuild();};
  g(&quot;mp_addrow&quot;).onclick=function(){captureMatrix();state.roles.push({id:++roleSeq,name:&quot;&quot;});renderMatrix();};
  g(&quot;wrap_shifttype&quot;).style.display=twoShifts()?&quot;none&quot;:&quot;&quot;;
  renderMatrix(); updScope();
  g(&quot;matrix&quot;).addEventListener(&quot;input&quot;,updTotals);
  function updTotals(){
    captureMatrix();
    var n=nSteps(),two=twoShifts(),parts=[],grand=0;
    for(var s=1;s<=n;s++){
      var day=0,night=0,tot=0;
      state.roles.forEach(function(r){
        if(two){day+=parseInt(state.mp[mpKey(r.id,s,&quot;day&quot;)]||0)||0;night+=parseInt(state.mp[mpKey(r.id,s,&quot;night&quot;)]||0)||0;}
        else tot+=parseInt(state.mp[mpKey(r.id,s,&quot;&quot;)]||0)||0;
      });
      var st=two?(day+night):tot; grand+=st;
      parts.push(stepName(s)+&quot;: &quot;+st+(two?(&quot; (día &quot;+day+&quot; / noche &quot;+night+&quot;)&quot;):&quot;&quot;));
    }
    g(&quot;mp_totals&quot;).textContent=&quot;Operarios · &quot;+parts.join(&quot;   |   &quot;)+&quot;   —   TOTAL introducido (suma de celdas): &quot;+grand;
  }

  /* ---------------- DOCX HELPERS ---------------- */
  function fdate(val){if(!val)return&quot;&quot;;if(val.indexOf(&quot;-&quot;)>0){var p=val.split(&quot;-&quot;);return p[2]+&quot;/&quot;+p[1]+&quot;/&quot;+p[0];}return val;}
  function parseEuro(s,el){var raw=String(s||&quot;&quot;).trim();var t=raw.replace(/\s|€/g,&quot;&quot;).replace(/\./g,&quot;&quot;).replace(&quot;,&quot;,&quot;.&quot;);var n=parseFloat(t);if(isNaN(n)){if(raw){badAmounts++;if(el)el.classList.add(&quot;badnum&quot;);}else if(el)el.classList.remove(&quot;badnum&quot;);return 0;}if(el)el.classList.remove(&quot;badnum&quot;);return n;}
  function fmtEuro(n){return n.toLocaleString(&quot;de-DE&quot;,{minimumFractionDigits:2,maximumFractionDigits:2});}
  function tplFill(tpl,val){return tpl.split(&quot;{{TXT}}&quot;).join(xesc(val));}
  function enclosingP(xml,pos){var a=xml.lastIndexOf(&quot;<w:p &quot;,pos),b=xml.lastIndexOf(&quot;<w:p>&quot;,pos);var st=Math.max(a,b);var en=xml.indexOf(&quot;</w:p>&quot;,pos);en=(en<0?xml.length:en+6);return[st,en];}
  function removeMarkerPara(xml,m){var i=xml.indexOf(m);if(i<0)return xml;var r=enclosingP(xml,i);return xml.slice(0,r[0])+xml.slice(r[1]);}
  function toggleSection(xml,key,keep){var sm=&quot;@@SEC:&quot;+key+&quot;@@&quot;,em=&quot;@@ENDSEC:&quot;+key+&quot;@@&quot;;if(keep){xml=removeMarkerPara(xml,sm);return removeMarkerPara(xml,em);}var i=xml.indexOf(sm);if(i<0)return xml;var j=xml.indexOf(em);if(j<0)return xml;var r1=enclosingP(xml,i),r2=enclosingP(xml,j);return xml.slice(0,r1[0])+xml.slice(r2[1]);}
  function fillBlock(xml,marker,content){var i=xml.indexOf(marker);if(i<0)return xml;var r=enclosingP(xml,i);return xml.slice(0,r[0])+content+xml.slice(r[1]);}
  function insertBefore(xml,marker,content){var i=xml.indexOf(marker);if(i<0)return xml;var r=enclosingP(xml,i);return xml.slice(0,r[0])+content+xml.slice(r[0]);}
  function fillList(xml,marker,tpl,items){return fillBlock(xml,marker,items.map(function(t){return tplFill(tpl,t);}).join(&quot;&quot;));}
  function tok(xml,name,val){return xml.split(&quot;{{&quot;+name+&quot;}}&quot;).join(xesc(val));}
  function cell(txt,o){o=o||{};var rpr='<w:rPr>'+(o.b?'<w:b/><w:bCs/>':'')+'<w:lang w:val=&quot;en-US&quot;/></w:rPr>';
    var run='<w:r>'+rpr+'<w:t xml:space=&quot;preserve&quot;>'+xesc(txt)+'</w:t></w:r>';
    return '<w:tc><w:tcPr><w:tcW w:w=&quot;'+(o.w||2200)+'&quot; w:type=&quot;dxa&quot;/>'+(o.shade?'<w:shd w:val=&quot;clear&quot; w:color=&quot;auto&quot; w:fill=&quot;'+o.shade+'&quot;/>':'')+'<w:vAlign w:val=&quot;center&quot;/></w:tcPr><w:p><w:pPr><w:jc w:val=&quot;'+(o.jc||&quot;left&quot;)+'&quot;/></w:pPr>'+run+'</w:p></w:tc>';}
  function tableXml(rows){
    var n=rows[0].length,W=Math.floor(9000/n),grid=&quot;&quot;,i;
    for(i=0;i<n;i++)grid+='<w:gridCol w:w=&quot;'+W+'&quot;/>';
    var trs=rows.map(function(row,ri){
      var cells=row.map(function(c,ci){return cell(c,{w:W,b:(ri===0),shade:(ri===0?&quot;D9E2F3&quot;:null),jc:(ci===0?&quot;left&quot;:&quot;center&quot;)});}).join(&quot;&quot;);
      return '<w:tr>'+(ri===0?'<w:trPr><w:tblHeader/></w:trPr>':'')+cells+'</w:tr>';
    }).join(&quot;&quot;);
    var bd='<w:tblBorders><w:top w:val=&quot;single&quot; w:sz=&quot;4&quot; w:space=&quot;0&quot; w:color=&quot;AAAAAA&quot;/><w:left w:val=&quot;single&quot; w:sz=&quot;4&quot; w:space=&quot;0&quot; w:color=&quot;AAAAAA&quot;/><w:bottom w:val=&quot;single&quot; w:sz=&quot;4&quot; w:space=&quot;0&quot; w:color=&quot;AAAAAA&quot;/><w:right w:val=&quot;single&quot; w:sz=&quot;4&quot; w:space=&quot;0&quot; w:color=&quot;AAAAAA&quot;/><w:insideH w:val=&quot;single&quot; w:sz=&quot;4&quot; w:space=&quot;0&quot; w:color=&quot;AAAAAA&quot;/><w:insideV w:val=&quot;single&quot; w:sz=&quot;4&quot; w:space=&quot;0&quot; w:color=&quot;AAAAAA&quot;/></w:tblBorders>';
    return '<w:tbl><w:tblPr><w:tblW w:w=&quot;0&quot; w:type=&quot;auto&quot;/>'+bd+'</w:tblPr><w:tblGrid>'+grid+'</w:tblGrid>'+trs+'</w:tbl><w:p/>';
  }

(function(){

  function collect(){

    });

    document.querySelectorAll('.cnt[id]').forEach(function(sp){o.cnt[sp.id]=sp.textContent;});

  }
  window.__prlCollect=collect;
  function fire(e){try{e.dispatchEvent(new Event('change',{bubbles:true}));e.dispatchEvent(new Event('input',{bubbles:true}));}catch(x){}}
  function apply(o){
    if(!o)return;
    Object.keys(o.v||{}).forEach(function(id){var e=document.getElementById(id);if(e)e.value=o.v[id];});
    Object.keys(o.c||{}).forEach(function(id){var e=document.getElementById(id);if(e)e.checked=o.c[id];});
    Object.keys(o.cnt||{}).forEach(function(id){var e=document.getElementById(id);if(e)e.textContent=o.cnt[id];});

    +'<label for=&quot;prl_file&quot; style=&quot;font-family:inherit;font-size:13px;padding:9px 14px;border:1px solid #c7cee0;border-radius:8px;background:#fff;cursor:pointer;font-weight:600;color:#0C1040&quot;>Cargar borrador</label>'
    +'<input id=&quot;prl_file&quot; type=&quot;file&quot; accept=&quot;application/json,.json&quot; style=&quot;display:none&quot;>'
    +'<span id=&quot;prl_autosave&quot; style=&quot;font-size:12px;color:#8a93a8&quot;></span>';
  body.insertBefore(bar, body.firstChild);
  document.getElementById('prl_save').onclick=function(){var blob=new Blob([JSON.stringify(collect(),null,2)],{type:&quot;application/json&quot;});var a=document.createElement('a');a.href=URL.createObjectURL(blob);var c=document.getElementById('f_codigo');var cod=(c&amp;&amp;c.value.trim())||&quot;borrador&quot;;a.download=cod.replace(/[^\w.-]+/g,&quot;_&quot;)+&quot;_PRL.json&quot;;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);};
  document.getElementById('prl_file').onchange=function(e){var fl=e.target.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){try{apply(JSON.parse(rd.result));save();document.getElementById('prl_autosave').textContent=&quot;Borrador cargado desde archivo.&quot;;}catch(err){alert(&quot;Archivo no valido: &quot;+err.message);}};rd.readAsText(fl);e.target.value=&quot;&quot;;};
  try{var sv=localStorage.getItem(SKEY);if(sv){apply(JSON.parse(sv));document.getElementById('prl_autosave').textContent=&quot;Borrador recuperado automaticamente.&quot;;}}catch(e){}
})();

<script>
(function(){
  function mkArrow(){var s=document.createElement(&quot;span&quot;);s.className=&quot;secarrow&quot;;s.textContent=&quot;▾&quot;;return s;}
  Array.prototype.slice.call(document.querySelectorAll(&quot;.sec&quot;)).forEach(function(hd){
    var items=[],n=hd.nextElementSibling;
    while(n&amp;&amp;!n.classList.contains(&quot;sec&quot;)&amp;&amp;!n.classList.contains(&quot;btns&quot;)){items.push(n);n=n.nextElementSibling;}
    if(!items.length)return;
    var wrap=document.createElement(&quot;div&quot;);wrap.className=&quot;secwrap&quot;;
    hd.parentNode.insertBefore(wrap,items[0]);
    items.forEach(function(it){wrap.appendChild(it);});
    hd.appendChild(mkArrow());
    hd.style.cursor=&quot;pointer&quot;;
    hd.addEventListener(&quot;click&quot;,function(){hd.classList.toggle(&quot;collapsed&quot;);wrap.classList.toggle(&quot;collapsed&quot;);});
  });
  Array.prototype.slice.call(document.querySelectorAll(&quot;.scard&quot;)).forEach(function(card){
    var shead=card.firstElementChild;
    if(!shead||!shead.classList||!shead.classList.contains(&quot;shead&quot;))return;
    var items=[],n=shead.nextElementSibling;
    while(n){items.push(n);n=n.nextElementSibling;}
    if(!items.length)return;
    var wrap=document.createElement(&quot;div&quot;);wrap.className=&quot;secwrap&quot;;
    card.insertBefore(wrap,items[0]);
    items.forEach(function(it){wrap.appendChild(it);});
    var arrow=mkArrow();arrow.style.cursor=&quot;pointer&quot;;
    arrow.addEventListener(&quot;click&quot;,function(ev){ev.stopPropagation();shead.classList.toggle(&quot;collapsed&quot;);wrap.classList.toggle(&quot;collapsed&quot;);});
    shead.appendChild(arrow);
  });
  function removeCollapsed(e){if(e&amp;&amp;e.classList)e.classList.remove(&quot;collapsed&quot;);}
  function wrapOf(hd){var w=hd.nextElementSibling;return(w&amp;&amp;w.classList&amp;&amp;w.classList.contains(&quot;secwrap&quot;))?w:null;}
  window.__secExpandTo=function(id){
    var el=document.getElementById(id);
    if(!el)return;
    removeCollapsed(el);
    removeCollapsed(wrapOf(el));
    if(el.classList.contains(&quot;scard&quot;)&amp;&amp;el.firstElementChild){
      removeCollapsed(el.firstElementChild);
      removeCollapsed(wrapOf(el.firstElementChild));
    }
    var node=el.parentNode;
    while(node){
      if(node.classList&amp;&amp;node.classList.contains(&quot;secwrap&quot;)){
        node.classList.remove(&quot;collapsed&quot;);
        if(node.previousElementSibling)node.previousElementSibling.classList.remove(&quot;collapsed&quot;);
      }
      node=node.parentNode;
    }
  };
})();
</script>

(function(){

  function renderMerged(remote,errMsg){
    var local=getLocal();

    if(!combined.length){
      html+='<div class=&quot;empty&quot;>Aún no hay solicitudes.</div>';
      wrap.innerHTML=html;
      return;
    }
    combined.forEach(function(it){
      var st=it._local?{cls:&quot;local&quot;,txt:&quot;Pendiente de sincronizar&quot;}:statusOf(it.estado);
      html+='<div class=&quot;card&quot;>'
        +'<div class=&quot;top&quot;>'
          +'<div class=&quot;title&quot;>'+esc(it.titulo)+'</div>'
          +'<span class=&quot;badge '+st.cls+'&quot;>'+st.txt+'</span>'
        +'</div>'
        +'<div class=&quot;meta&quot;><span class=&quot;badge tool&quot;>'+esc(it.herramienta||&quot;—&quot;)+'</span>&amp;nbsp; Creada: '+fmtDate(it.creada)+'</div>'
        +(it._local?'<div class=&quot;hint&quot;>Esta solicitud se descargó pero aún no está en la lista compartida.</div>':'')
      +'</div>';
    });
    wrap.innerHTML=html;
  }

      .then(function(r){
        if(!r.ok)throw new Error(&quot;HTTP &quot;+r.status);
        return r.json();
      })
      .then(function(data){
        if(!Array.isArray(data))throw new Error(&quot;respuesta inesperada&quot;);
        renderMerged(data,null);

    if(!desc){g(&quot;fld_desc&quot;).classList.add(&quot;error&quot;);ok=false;}
    if(!ok){
      msg(&quot;err&quot;,&quot;Completa los campos obligatorios (título y descripción).&quot;);
      return;
    }
    var herramienta=g(&quot;f_herramienta&quot;).value===&quot;prl&quot;?&quot;PRL&quot;:&quot;Ofertas&quot;;
    var btn=g(&quot;btn_send&quot;);
    btn.disabled=true;
    var item={
      id:Date.now(),
      herramienta:herramienta,
      titulo:titulo,
      descripcion:desc,
      estado:&quot;Pendiente&quot;,
      creada:new Date().toISOString()
    };
    try{
      var blob=new Blob([JSON.stringify(item,null,2)],{type:&quot;application/json&quot;});
      var a=document.createElement(&quot;a&quot;);
      a.href=URL.createObjectURL(blob);
      a.download=(&quot;solicitud_&quot;+item.id).replace(/[^\w.-]+/g,&quot;_&quot;)+&quot;.json&quot;;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
    }catch(e){
      console.error(&quot;Error generando el archivo de la solicitud:&quot;,e);
      btn.disabled=false;
      msg(&quot;err&quot;,&quot;No se pudo generar el archivo de la solicitud.&quot;);
      return;
    }
    var local=getLocal();
    local.unshift(item);
    setLocal(local);
    btn.disabled=false;
    msg(&quot;ok&quot;,&quot;Solicitud descargada a tu carpeta de Descargas. Se añadirá a la lista compartida cuando se sincronice.&quot;);
    g(&quot;f_titulo&quot;).value=&quot;&quot;;
    g(&quot;f_desc&quot;).value=&quot;&quot;;
    g(&quot;f_herramienta&quot;).value=&quot;ofertas&quot;;
    loadList();
  }
  g(&quot;btn_send&quot;).onclick=sendRequest;
  g(&quot;btn_refresh&quot;).onclick=loadList;
  loadList();
})();
</script>
</body>

<script>
  (function(){
    var tabs=document.querySelectorAll(".tab");
    function show(t){
      tabs.forEach(function(b){b.classList.toggle("active",b.dataset.t===t);});
      document.getElementById("frm-off").classList.toggle("active",t==="off");
      document.getElementById("frm-prl").classList.toggle("active",t==="prl");
      document.getElementById("frm-req").classList.toggle("active",t==="req");
      try{localStorage.setItem("bipr_tab",t);}catch(e){}
    }
    tabs.forEach(function(b){b.onclick=function(){show(b.dataset.t);};});
    try{var last=localStorage.getItem("bipr_tab");if(last)show(last);}catch(e){}
  })();
</script>
